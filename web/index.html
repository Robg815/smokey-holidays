<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holidays</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/advent.css">
<link rel="stylesheet" href="css/events.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="app" class="hidden" role="dialog" aria-modal="true" aria-labelledby="title">
  <div class="rig">
    <header class="top">
      <div class="ttl">
        <img id="emblem" alt="" hidden>
        <div><h1 id="title"></h1><p id="blurb"></p></div>
      </div>
      <div class="when"><span id="countdown"></span><span id="today"></span></div>
      <div class="acts">
        <button id="skin" type="button" hidden>Holo skin</button>
        <button id="close" type="button">Close <kbd>Esc</kbd></button>
      </div>
    </header>
    <div class="stage">
      <aside class="side"><h2>Coming up</h2><ul id="upcoming"></ul></aside>
      <section id="main"></section>
    </div>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </div>
  <div class="emitter"></div>
</div>
<div id="admin" class="off" role="dialog" aria-modal="true" aria-label="Holiday admin"></div>
<script src="js/core.js"></script>
<script src="js/advent.js"></script>
<script src="js/events.js"></script>
<script src="js/admin.js"></script>
<script src="js/preview.js"></script>
</body>
</html>
